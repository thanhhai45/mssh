name: release

on:
  push:
    tags: ['v*']
# Read-only for every job: the builds run third-party tools, and none of them
# needs to write anything. Only publish is given more, below.
permissions:
  contents: read
jobs:
  version:
    # The macOS files are named after the tag, the Linux packages after
    # wails.json. Both have to say the same thing before anything is built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The tag matches wails.json
        run: |
          expected="v$(jq -r .info.productVersion wails.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "The tag is $GITHUB_REF_NAME but wails.json says $expected."
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Wails
        # The same version as go.mod, so the CLI and the library agree.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Test
        # Not ./... — package main cannot compile until wails build has created
        # frontend/dist, which go:embed needs. Every test lives under internal/.
        run: go test ./internal/...

      - name: Build
        run: wails build -platform darwin/universal -clean

      - name: Verify the binary is universal
        run: |
          lipo -info build/bin/mssh.app/Contents/MacOS/mssh | grep -q "x86_64 arm64" \
            || { echo "not a universal binary"; exit 1; }

      - name: Package
        run: |
          cd build/bin
          ditto -c -k --keepParent mssh.app mssh-${GITHUB_REF_NAME}-macos-universal.zip

      - name: Disk image
        # The same script used by hand — see docs/DMG.md.
        run: scripts/dmg.sh build/bin/mssh-${GITHUB_REF_NAME}-macos-universal.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            build/bin/*.zip
            build/bin/*.dmg

  linux:
    needs: version
    # 22.04 for its older glibc: what is built here runs on 22.04 and later.
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Version
        # See check.yml: on a line of its own so that a failing jq stops here.
        run: |
          version=$(jq -er .info.productVersion wails.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: wails build -platform linux/${{ matrix.arch }} -tags webkit2_41

      - name: .deb and .rpm
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          nfpm package --config build/linux/nfpm.yaml --packager deb --target build/bin/
          nfpm package --config build/linux/nfpm.yaml --packager rpm --target build/bin/

      - name: AppImage
        if: matrix.arch == 'amd64'
        run: bash build/linux/appimage.sh "$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/bin/*.deb
            build/bin/*.rpm
            build/bin/*.AppImage
  
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: NSIS
        # See check.yml: installed only if the image lacks it.
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --version=3.13.0 -y --no-progress
          }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: wails build -platform windows/amd64 -nsis

      - name: Package
        # Named after the tag, as the macOS files are. The zip is mssh.exe on
        # its own, for running with installing
        shell: pwsh
        run: |
          Set-Location build/bin
          Get-ChildItem *-installer.exe |
            Rename-Item -NewName "mssh-$env:GITHUB_REF_NAME-windows-amd64-installer.exe"
          Compress-Archive -Path mssh.exe -DestinationPath "mssh-$env:GITHUB_REF_NAME-windows-amd64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            build/bin/*-installer.exe
            build/bin/*.zip
      

  publish:
    # One job makes the release, once every build has succeeded. Two jobs
    # uploading at the same moment can each create a release of their own, and
    # a failed Linux build must not leave a release with only the Mac files.
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and attaching the files.
      contents: write
      # Signing the provenance below with this workflow's identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        # One line per file, for `sha256sum --check SHA256SUMS` after a
        # download. Written beside dist first, so the glob cannot list it.
        working-directory: dist
        run: |
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Build provenance
        # A statement signed with this workflow's identity and recorded by
        # GitHub: each file was built here, from this commit. Checked with
        # `gh attestation verify <file> -R thanhhai45/mssh`.
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
