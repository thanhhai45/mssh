name: release

on:
  push:
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Test
        # Not ./... — package main cannot compile until wails build has created
        # frontend/dist, which go:embed needs. Every test lives under internal/.
        run: go test ./internal/...

      - name: Build
        run: wails build -platform darwin/universal -clean
      
      - name: Verify the binary is universal
        run: |
          lipo -info build/bin/mssh.app/Contents/MacOS/mssh | grep -q "x86_64 arm64" \
            || { echo "not a universal binary"; exit 1; }

      - name: Package
        run: |
          cd build/bin
          ditto -c -k --keepParent mssh.app mssh-${GITHUB_REF_NAME}-macos-universal.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.zip