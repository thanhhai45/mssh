name: check

# Every push and every pull request, unlike release.yml which only runs on a
# tag. The point is to find out before cutting a version, not after.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    # One run per system. Compiling for Windows on a Mac proves the code
    # builds there; only running it there proves it works.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04, not latest: Linux releases will be built on 22.04
        # for its older glibc so the tests run where the build will.
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows would use PowerShell. Every runner has bash(Windows through Git for Windows)
        # and one shell means each step is written once.
        shell: bash
    steps:
      - name: Keep line endings as committed
        # Git on Windows turns \n into \r\n on checkout, gofmt would then call
        # every file unformatted, and .errcheck-excludes would carry a stray \r
        # on each line. Must run before checkout.
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal *.go)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./internal/...

      - name: Test
        # Not ./... — package main cannot compile until wails build has created
        # frontend/dist, which go:embed needs. Every test lives under internal/.
        run: go test ./internal/...

      - name: errcheck
        # go run rather than go install: no need to know where GOPATH/bin is,
        # which on Windows is a C:\ path bash would have to be told about.
        run: go run github.com/kisielk/errcheck@latest -exclude .errcheck-excludes ./internal/...

  linux-build:
    # The whole app, built the way the Linux release will be. On Linux a Wails
    # app reaches GTK and WebKitGTK through cgo, so vet and test passing say
    # nothing about whether it builds.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Install Wails
        # The same version as go.mod, so the CLI and the library agree.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        # webkit2_41: Wails looks for WebKitGTK 4.0 unless told otherwise, and
        # Ubuntu 24.04 no longer ships 4.0 at all. 22.04 has both.
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: What the binary needs
        # The newest glibc symbol is the oldest system it can run on.
        run: |
          file build/bin/mssh
          ldd build/bin/mssh | grep -E 'gtk|webkit'
          objdump -T build/bin/mssh | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Desktop entry
        run: desktop-file-validate build/linux/mssh.desktop

      - name: .deb and .rpm
        # One nfpm.yaml makes both. The version comes from wails.json, the on
        # place it is written down.
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export VERSION=$(jp -r .info.productVersion wails.json)
          nfpm package --config build/linux/nfpm.yaml --packager deb --target build/bin
          nfpm package --config build/linux/nfpm.yaml --packager rpm --target build/bin

      - name: AppImage
        run: bash build/linux/appimage.sh "$(jq -r .info.productionVersion wails.json)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/bin/*.deb
            build/bin/*.rpm
            build/bin/*.AppImage

  linux-install:
    # Each package installed where people will install it, by the system's own
    # package manager: what it declares must be enough for the binary to start.
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./mssh_*.deb
          - image: ubuntu:latest
            install: apt-get update && apt-get install -y ./mssh_*.deb
          - image: fedora:latest
            install: dnf install -y ./mssh-*.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./mssh-*.rpm
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      # Ubuntu would otherwise stop to ask for a time zone while installing.
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages

      - name: Install
        run: ${{ matrix.install }}

      - name: Every library found
        run: |
          ls -l /usr/bin/mssh /usr/share/applications/mssh.desktop
          if ldd /usr/bin/mssh | grep 'not found'; then
            exit 1
          fi
  appimage-run:
    # The AppImage started where WebKitGTK is not installed at all: the window
    # comes up under a virtual X server, and WebKit's helper processes - the
    # part that needed patching - have to start with it. The container gets
    # exactly what linuxdeploy leaves to the system (fonts, X11 and Wayland,
    # OpenGL, the C and C++ runtimes; "Skipping deployment of blacklisted
    # library" in the build log) - what any desktop already has - and no more.
    # Plus OpenGL ES, which WebKit opens at run time, where linuxdeploy cannot
    # see it: Arch's libglvnd has it, Ubuntu and Fedora package it apart.
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            prepare: apt-get update && apt-get install -y xvfb xauth procps fonts-dejavu-core libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libegl1 libgl1 libgles2 libgbm1 libdrm2 libexpat1 libuuid1 libgmp10 libgpg-error0 libcom-err2 libstdc++6 zlib1g
          - image: ubuntu:latest
            prepare: apt-get update && apt-get install -y xvfb xauth procps fonts-dejavu-core libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libegl1 libgl1 libgles2 libgbm1 libdrm2 libexpat1 libuuid1 libgmp10 libgpg-error0 libcom-err2 libstdc++6 zlib1g
          - image: fedora:latest
            prepare: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth procps-ng dejavu-sans-fonts fontconfig freetype harfbuzz fribidi libX11 libX11-xcb libxcb libwayland-client mesa-libEGL mesa-libGL libglvnd-gles mesa-libgbm libdrm expat libuuid gmp libgpg-error libcom_err libstdc++ zlib-ng-compat
          - image: archlinux:latest
            prepare: pacman -Sy --noconfirm xorg-server-xvfb xorg-xauth procps-ng ttf-dejavu fontconfig freetype2 harfbuzz fribidi libx11 libxcb wayland mesa libglvnd libdrm expat util-linux-libs gmp libgpg-error e2fsprogs gcc-libs zlib
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # No FUSE in a container: unpack to /tmp and run from there instead.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages

      - name: A virtual X server
        run: ${{ matrix.prepare }}

      - name: Libraries the AppImage expects from the system
        # Each file inside the AppImage that cannot find a library, and which.
        # GTK's modules show up here harmlessly: they are only ever loaded into
        # a process that has GTK already. mssh and WebKit's helpers must not.
        run: |
          chmod +x ./mssh-*.AppImage
          ./mssh-*.AppImage --appimage-extract > /dev/null
          find squashfs-root -type f \( -name '*.so*' -o -perm -u+x \) | while read -r file; do
            missing=$(ldd "$file" 2>/dev/null | grep 'not found' || true)
            if [ -n "$missing" ]; then
              echo "$file"
              echo "$missing"
            fi
          done

      - name: Starts, and WebKit's helpers start with it
        run: |
          chmod +x ./mssh-*.AppImage
          xvfb-run -a ./mssh-*.AppImage > mssh.log 2>&1 &
          sleep 20
          ps -eo args | grep -E 'mssh|WebKit' | grep -v grep || true
          cat mssh.log
          pgrep -x mssh > /dev/null
          pgrep -f WebKitWebProcess > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
